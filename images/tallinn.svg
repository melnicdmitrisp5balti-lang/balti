<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Таллин — старый город: стилизованная иллюстрация -->
  <defs>
    <linearGradient id="skyT" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87ceeb"/>
      <stop offset="100%" style="stop-color:#d4edf9"/>
    </linearGradient>
    <linearGradient id="groundT" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b7355"/>
      <stop offset="100%" style="stop-color:#6b5c45"/>
    </linearGradient>
  </defs>
  <!-- Небо -->
  <rect width="800" height="500" fill="url(#skyT)"/>
  <!-- Облака -->
  <ellipse cx="150" cy="80" rx="60" ry="25" fill="white" opacity="0.85"/>
  <ellipse cx="200" cy="70" rx="45" ry="20" fill="white" opacity="0.85"/>
  <ellipse cx="600" cy="100" rx="70" ry="28" fill="white" opacity="0.8"/>
  <ellipse cx="650" cy="90" rx="50" ry="22" fill="white" opacity="0.8"/>
  <!-- Земля -->
  <rect x="0" y="400" width="800" height="100" fill="url(#groundT)"/>
  <!-- Стены города -->
  <rect x="0"   y="340" width="800" height="65" fill="#c4a882"/>
  <!-- Башни и здания -->
  <!-- Ратуша (центр) -->
  <rect x="340" y="200" width="120" height="200" fill="#d4c5a9"/>
  <polygon points="340,200 400,130 460,200" fill="#8b6914"/>
  <rect x="390" y="110" width="20" height="40" fill="#c8a830"/>
  <rect x="395" y="95"  width="10" height="20" fill="#8b6914"/>
  <!-- Шпиль ратуши -->
  <rect x="398" y="70"  width="4" height="30" fill="#8b6914"/>
  <polygon points="397,70 400,60 403,70" fill="#c8a830"/>
  <!-- Окна ратуши -->
  <rect x="355" y="230" width="20" height="30" fill="#87ceeb" rx="2"/>
  <rect x="385" y="230" width="20" height="30" fill="#87ceeb" rx="2"/>
  <rect x="415" y="230" width="20" height="30" fill="#87ceeb" rx="2"/>
  <rect x="445" y="230" width="20" height="30" fill="#87ceeb" rx="2"/>
  <!-- Церковь Олевисте (левее) -->
  <rect x="160" y="260" width="80" height="180" fill="#c4b8a0"/>
  <polygon points="160,260 200,180 240,260" fill="#a09080"/>
  <rect x="194" y="155" width="12" height="50" fill="#d4c090"/>
  <polygon points="193,155 200,140 207,155" fill="#8b7060"/>
  <rect x="199" y="132" width="2" height="16" fill="#8b7060"/>
  <!-- Здание слева -->
  <rect x="50"  y="290" width="90" height="150" fill="#d8cbb8"/>
  <polygon points="50,290 95,240 140,290" fill="#b0a090"/>
  <!-- Здание справа -->
  <rect x="580" y="280" width="100" height="160" fill="#d0c4b0"/>
  <polygon points="580,280 630,230 680,280" fill="#a89880"/>
  <!-- Башня справа -->
  <rect x="700" y="270" width="70" height="170" fill="#c8baa8"/>
  <polygon points="700,270 735,210 770,270" fill="#a89070"/>
  <rect x="730" y="195" width="10" height="30" fill="#c8a830"/>
  <!-- Мощёная дорога -->
  <ellipse cx="400" cy="420" rx="350" ry="18" fill="#b8a890" opacity="0.5"/>
  <!-- Надпись -->
  <text x="400" y="480" text-anchor="middle" font-family="serif" font-size="20" fill="#4a3520" font-weight="bold">Таллин — Старый город</text>
</svg>
