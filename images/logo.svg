      <stop offset="0%" style="stop-color:#1b4a6e"/>
      <stop offset="100%" style="stop-color:#2d7dd2"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#seaGrad)" stroke="#f7b731" stroke-width="3"/>
