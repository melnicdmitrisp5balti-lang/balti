<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Стилизованная карта Балтийского региона -->
  <defs>
    <linearGradient id="seaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8e6ff"/>
      <stop offset="100%" style="stop-color:#8ec8f0"/>
    </linearGradient>
  </defs>
  <!-- Море -->
  <rect width="800" height="500" fill="url(#seaBg)" rx="12"/>
  <!-- Надпись море -->
  <text x="120" y="200" font-family="serif" font-size="18" fill="#1b4a6e" opacity="0.6" font-style="italic">Балтийское море</text>

  <!-- Литва (примерное контурное положение) -->
  <path d="M380 300 L420 280 L450 275 L470 285 L475 310 L460 330 L440 345 L410 350 L385 335 Z"
        fill="#006A44" stroke="white" stroke-width="1.5" opacity="0.85"/>
  <text x="425" y="320" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">ЛИТВА</text>

  <!-- Латвия -->
  <path d="M370 225 L420 210 L460 212 L475 225 L472 255 L450 268 L420 275 L385 268 L367 250 Z"
        fill="#9E3039" stroke="white" stroke-width="1.5" opacity="0.85"/>
  <text x="420" y="245" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">ЛАТВИЯ</text>

  <!-- Эстония -->
  <path d="M375 165 L415 152 L450 155 L465 168 L462 195 L440 205 L415 208 L380 198 L368 183 Z"
        fill="#0072CE" stroke="white" stroke-width="1.5" opacity="0.85"/>
  <text x="417" y="183" text-anchor="middle" font-family="sans-serif" font-size="13" fill="white" font-weight="bold">ЭСТОНИЯ</text>

  <!-- Столицы -->
  <circle cx="432" cy="175" r="5" fill="#FFD700" stroke="white" stroke-width="1.5"/>
  <text x="440" y="173" font-family="sans-serif" font-size="10" fill="#0a1e2e">Таллин</text>

  <circle cx="425" cy="238" r="5" fill="#FFD700" stroke="white" stroke-width="1.5"/>
  <text x="433" y="236" font-family="sans-serif" font-size="10" fill="#0a1e2e">Рига</text>

  <circle cx="428" cy="318" r="5" fill="#FFD700" stroke="white" stroke-width="1.5"/>
  <text x="436" y="316" font-family="sans-serif" font-size="10" fill="#0a1e2e">Вильнюс</text>

  <!-- Компас -->
  <g transform="translate(700,80)">
    <circle r="30" fill="rgba(255,255,255,0.6)" stroke="#1b4a6e" stroke-width="1.5"/>
    <text x="0"  y="-16" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1b4a6e" font-weight="bold">С</text>
    <text x="0"  y="20"  text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1b4a6e">Ю</text>
    <text x="-20" y="5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1b4a6e">З</text>
    <text x="20"  y="5" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1b4a6e">В</text>
    <line x1="0" y1="-22" x2="0" y2="22" stroke="#1b4a6e" stroke-width="0.8"/>
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#1b4a6e" stroke-width="0.8"/>
  </g>
</svg>
